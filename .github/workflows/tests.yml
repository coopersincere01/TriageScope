name: TriageScope CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out project code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py scoring.py guidance.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: triagescope-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: us-central1-docker.pkg.dev/triagescope/cloud-run-source-deploy/triagescope:${{ github.sha }}

    steps:
      - name: Check out project code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/168374564156/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-triagescope-deploy@triagescope.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy candidate, verify, and promote
        run: bash scripts/deploy_safely.sh "$IMAGE"
