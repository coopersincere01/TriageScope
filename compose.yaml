services:
  triagescope:
    build: .
    image: triagescope:local
    ports:
      - "5001:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
